<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delta Draft</title>
    <style>
        :root { --bg-primary: #0f172a; --bg-secondary: #1e293b; --border-color: #334155; --text-primary: #e2e8f0; --text-secondary: #94a3b8; --accent-color: #60a5fa; --green-pos: #22c55e; --red-neg: #ef4444; --yellow-warn: #facc15; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg-primary); color: var(--text-primary); display: flex; justify-content: center; margin: 0; padding: 20px; }
        * { box-sizing: border-box; }
        .app-container { width: 100%; max-width: 1200px; }
        .controls { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 15px; margin-bottom: 20px; }
        button, input[type="number"], input[type="text"], select { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color); background-color: var(--bg-secondary); color: var(--text-primary); font-size: 1rem; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: var(--border-color); }
        button:disabled { background-color: #1e293b; color: #475569; cursor: not-allowed; }
        input[type="number"], input[type="text"], select { cursor: text; }
        .live-indicator { width: 10px; height: 10px; border-radius: 50%; background-color: #64748b; margin-right: 8px; display: inline-block; transition: background-color 0.3s; }
        .live-indicator.active { background-color: var(--red-neg); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } }
        .draft-area { display: flex; justify-content: space-between; gap: 20px; }
        .team-panel { width: 150px; display: flex; flex-direction: column; gap: 10px; }
        .team-panel h2 { text-align: center; margin: 0 0 10px 0; color: var(--text-secondary); }
        #left-team-header.blue-side, #right-team-header.blue-side { color: #5c9be4; }
        #left-team-header.red-side, #right-team-header.red-side { color: #e84e4e; }
        .role-slot { width: 100%; height: 100px; background-color: var(--bg-secondary); border: 2px dashed var(--border-color); border-radius: 8px; position: relative; cursor: pointer; transition: border-color 0.2s; overflow: hidden; }
        .role-slot.selected { border-color: var(--accent-color); border-style: solid; }
        .role-slot.swap-source { border-color: var(--yellow-warn); border-style: solid; }
        .role-icon { width: 50%; height: 50%; opacity: 0.2; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .champion-portrait { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; pointer-events: none; }
        .center-column { flex-grow: 1; display: flex; flex-direction: column; }
        #search-champion { width: 100%; padding: 10px; margin-bottom: 10px; background-color: var(--bg-secondary); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 6px; font-size: 1rem; }
        #champion-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; height: 350px; overflow-y: auto; padding-right: 10px; margin-bottom: 20px;}
        .champion-tile { cursor: pointer; position: relative; }
        .champion-tile img { width: 100%; display: block; border-radius: 4px; border: 2px solid transparent; transition: border-color 0.2s, filter 0.2s, opacity 0.2s; }
        .champion-tile:hover img { border-color: var(--accent-color); }
        #results { background-color: var(--bg-secondary); padding: 15px; border-radius: 8px; flex-grow: 1; display: flex; flex-direction: column; }
        #recommendation-list, #ban-recommendation-list { list-style: none; padding: 0; margin-top: 10px; flex-grow: 1; overflow-y: auto; }
        #recommendation-list li { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid var(--border-color); position: relative; transition: filter 0.2s, opacity 0.2s; }
        #ban-recommendation-list li { flex-direction: column; align-items: stretch; padding: 0; border-bottom: 1px solid var(--border-color); }
        .ban-rec-summary { display: flex; align-items: center; gap: 10px; padding: 8px; cursor: pointer; }
        .rec-img { width: 40px; height: 40px; border-radius: 4px; }
        .rec-info { flex-grow: 1; }
        .rec-name { font-weight: bold; }
        .rec-stats { font-size: 0.8rem; color: var(--text-secondary); }
        .delta-pos { color: var(--green-pos); } .delta-neg { color: var(--red-neg); }
        .warning-icon { position: absolute; top: 5px; font-size: 1.2rem; color: var(--yellow-warn); text-shadow: 0 0 5px black; z-index: 2; }
        .warning-icon.left { left: 5px; } .warning-icon.right { right: 5px; }
        .tooltip { position: fixed; background-color: #020617; border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; z-index: 100; pointer-events: none; opacity: 0; transition: opacity 0.1s; }
        #delta-tooltip { width: 320px; } #warning-tooltip { width: 250px; }
        #delta-tooltip h4, #warning-tooltip h4 { margin: 0 0 10px 0; color: var(--accent-color); font-size: 1rem; text-align: center; }
        .tooltip-columns { display: flex; justify-content: space-between; gap: 15px; }
        .tooltip-col { flex: 1; }
        .tooltip-col h5 { margin: 0 0 5px 0; font-size: 0.9rem; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); padding-bottom: 3px; }
        .tooltip-col div { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 2px; height: 20px; align-items: center;}
        .tooltip-col .champ-name { max-width: 70px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: middle; }
        .delta-neutral { color: var(--text-secondary); font-style: italic; font-size: 0.8rem;}
        .games-count { font-size: 0.75rem; color: var(--text-secondary); margin-left: 5px; }
        .recommendation-controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; align-items: center; }
        .recommendation-controls input[type="text"] { flex-grow: 1; font-size: 0.9rem; min-width: 150px; }
        .recommendation-controls input[type="number"] { width: 160px; font-size: 0.9rem; flex-shrink: 0; }
        .recommendation-controls button { flex-shrink: 0; }
        .favorite-toggle-label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .grid-favorite-star { position: absolute; top: 2px; right: 2px; color: var(--yellow-warn); font-size: 1.2rem; text-shadow: 0 0 3px black; pointer-events: none; display: none; }
        .champion-tile.is-favorite .grid-favorite-star { display: block; }
        .rec-favorite-star { color: var(--yellow-warn); margin-left: 5px; }
        #context-menu { position: fixed; z-index: 1000; background-color: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 6px; padding: 5px; display: none; }
        .context-menu-item { padding: 8px 12px; cursor: pointer; white-space: nowrap; }
        .context-menu-item:hover { background-color: var(--bg-secondary); }
        .context-menu-item .star { margin-right: 8px; color: var(--text-secondary); }
        .context-menu-item.favorited .star { color: var(--yellow-warn); }
        .unavailable { filter: grayscale(100%); opacity: 0.5; }
        .champion-tile.unavailable { pointer-events: none; }
        .lock-icon { position: absolute; bottom: 4px; right: 5px; cursor: pointer; font-size: 1rem; display: none; color: var(--text-secondary); text-shadow: 0 0 3px black; }
        .role-slot[data-champion] .lock-icon { display: block; }
        .lock-icon.locked { color: var(--accent-color); }
        .tabs { display: flex; border-bottom: 1px solid var(--border-color); }
        .tab-btn { background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 10px 15px; color: var(--text-secondary); font-size: 1rem; }
        .tab-btn.active { color: var(--accent-color); border-bottom-color: var(--accent-color); }
        .tab-content { padding-top: 15px; }
        #analysis-view { display: flex; flex-direction: column; gap: 5px; overflow-y: auto; }
        .analysis-row { display: flex; align-items: center; justify-content: space-between; padding: 5px; border-radius: 4px; background-color: #0f172a; }
        .analysis-cell { display: flex; align-items: center; }
        .analysis-cell.left { flex: 1; justify-content: flex-start; }
        .analysis-cell.right { flex: 1; justify-content: flex-end; text-align: right; }
        .analysis-cell img { width: 32px; height: 32px; border-radius: 4px; margin-right: 8px; }
        .analysis-cell.right img { margin-left: 8px; margin-right: 0; order: 1; }
        .analysis-champ-info { font-size: 0.9rem; }
        .analysis-champ-name { font-weight: bold; }
        .analysis-champ-stats { font-size: 0.75rem; color: var(--text-secondary); }
        .analysis-delta-separator { width: 100px; text-align: center; font-size: 0.8rem; color: var(--text-secondary); }
        .analysis-total-delta { text-align: center; padding: 10px; font-size: 1.1rem; border-bottom: 1px solid var(--border-color); margin-bottom: 10px; }
        .ban-rec-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
        .ban-rec-controls select { flex-grow: 1; }
        .ban-rec-controls button { flex-shrink: 0; }
        .champion-tile.ban-selected img { border-color: var(--red-neg); }
        .ban-rec-details { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; background-color: #0f172a; padding: 0 15px; }
        .ban-rec-details.visible { max-height: 500px; padding: 10px 15px; }
        .ban-rec-details div { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 2px 0; }
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex; justify-content: center; align-items: center;
            color: var(--text-primary); font-size: 1.5rem; z-index: 2000;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div id="loading-overlay" style="display: none;">
        <p id="loading-message">Waking up server...</p>
    </div>

    <div class="app-container">
        <div class="header"><h1>Delta Draft</h1></div>
        <div class="controls">
            <button id="reset-btn">Reset Draft</button>
            <button id="swap-sides-btn">Swap Blue/Red Sides</button>
            <button id="live-tracking-btn"><span id="live-indicator" class="live-indicator"></span>Start Live Tracking</button>
        </div>
        <div class="draft-area" id="draft-area">
            <div class="team-panel" id="left-team-panel"><h2 id="left-team-header"></h2></div>
            <div class="center-column">
                <input type="text" id="search-champion" placeholder="Search for a champion...">
                <div id="champion-grid"></div>
                <div id="results">
                    <div class="tabs">
                        <button id="rec-tab-btn" class="tab-btn active">Recommendations</button>
                        <button id="analysis-tab-btn" class="tab-btn">Draft Analysis</button>
                        <button id="ban-rec-tab-btn" class="tab-btn">Ban Recommender</button>
                    </div>
                    <div id="recommendations-view" class="tab-content">
                        <h3 id="recs-header">Recommendations:</h3>
                        <div class="recommendation-controls">
                            <input type="text" id="recommendation-search" placeholder="Search recommendations...">
                            <input type="number" id="role-rate-filter" placeholder="Min Role Rate %" min="0" max="100">
                            <label class="favorite-toggle-label">
                                <input type="checkbox" id="favorites-only-toggle"> Show Favorites Only
                            </label>
                            <button id="get-recs-btn" disabled>Get Recommendations</button>
                        </div>
                        <ol id="recommendation-list"></ol>
                    </div>
                    <div id="analysis-view" class="tab-content" style="display: none;">
                    </div>
                    <div id="ban-recommender-view" class="tab-content" style="display: none;">
                        <div class="ban-rec-controls">
                            <select id="ban-rec-role-select"></select>
                            <button id="ban-rec-use-favorites-btn">Use Favorites</button>
                            <label class="favorite-toggle-label">
                                <input type="checkbox" id="ban-rec-teammates-toggle"> Consider Teammates
                            </label>
                            <button id="get-ban-recs-btn">Get Ban Recommendations</button>
                        </div>
                        <ol id="ban-recommendation-list"></ol>
                    </div>
                </div>
            </div>
            <div class="team-panel" id="right-team-panel"><h2 id="right-team-header"></h2></div>
        </div>
        <div id="delta-tooltip" class="tooltip"></div>
        <div id="warning-tooltip" class="tooltip">This champion/role combination has a very low pick rate (<1%) in our dataset. Its stats may not be reliable.</div>
        <div id="context-menu"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const API_BASE_URL = 'https://deltadraft.onrender.com'; 

            const roles = ['TOP', 'JUNGLE', 'MIDDLE', 'BOTTOM', 'UTILITY'];
            let allChampions = [];
            let champIdToName = {};
            let roleProbabilities = {};
            let lcuIntervalId = null;
            let recommendationTarget = null;
            let validRolesSet = new Set();
            let lastKnownDraftState = '';
            let swapSourceSlot = null;
            let lastRecommendations = [];
            let isShiftPressed = false;
            let lastHoveredRec = null;
            let leftPanelIsBlue = true;
            let favorites = {};
            let unavailableChampions = new Set();
            let lockedSlots = new Set();
            let banConsiderationSet = new Set();
            let activeTab = 'recommendations';

            const championGrid = document.getElementById('champion-grid');
            const searchInput = document.getElementById('search-champion');
            const recommendationList = document.getElementById('recommendation-list');
            const liveTrackingBtn = document.getElementById('live-tracking-btn');
            const resetBtn = document.getElementById('reset-btn');
            const getRecsBtn = document.getElementById('get-recs-btn');
            const roleRateFilter = document.getElementById('role-rate-filter');
            const deltaTooltip = document.getElementById('delta-tooltip');
            const warningTooltip = document.getElementById('warning-tooltip');
            const draftArea = document.getElementById('draft-area');
            const leftTeamPanel = document.getElementById('left-team-panel');
            const rightTeamPanel = document.getElementById('right-team-panel');
            const recommendationSearch = document.getElementById('recommendation-search');
            const contextMenu = document.getElementById('context-menu');
            const favoritesOnlyToggle = document.getElementById('favorites-only-toggle');
            const swapSidesBtn = document.getElementById('swap-sides-btn');
            const recTabBtn = document.getElementById('rec-tab-btn');
            const analysisTabBtn = document.getElementById('analysis-tab-btn');
            const banRecTabBtn = document.getElementById('ban-rec-tab-btn');
            const recommendationsView = document.getElementById('recommendations-view');
            const analysisView = document.getElementById('analysis-view');
            const banRecommenderView = document.getElementById('ban-recommender-view');
            const recsHeader = document.getElementById('recs-header');
            const banRecRoleSelect = document.getElementById('ban-rec-role-select');
            const banRecUseFavoritesBtn = document.getElementById('ban-rec-use-favorites-btn');
            const banRecTeammatesToggle = document.getElementById('ban-rec-teammates-toggle');
            const getBanRecsBtn = document.getElementById('get-ban-recs-btn');
            const banRecommendationList = document.getElementById('ban-recommendation-list');
            const loadingOverlay = document.getElementById('loading-overlay');
            const loadingMessage = document.getElementById('loading-message');

            window.addEventListener('keydown', (e) => { if (e.key === 'Shift' && !isShiftPressed) { isShiftPressed = true; if (lastHoveredRec) updateTooltipContent(lastHoveredRec, true); } });
            window.addEventListener('keyup', (e) => { if (e.key === 'Shift') { isShiftPressed = false; if (lastHoveredRec) updateTooltipContent(lastHoveredRec, false); } });
            document.addEventListener('click', () => contextMenu.style.display = 'none');

            async function fetchWithRetry(url, options = {}, isInitialLoad = false) {
                const maxRetries = 12;
                let attempt = 0;
                
                if (isInitialLoad) {
                    loadingOverlay.style.display = 'flex';
                    loadingMessage.textContent = 'Contacting server...';
                }

                while (attempt < maxRetries) {
                    try {
                        const response = await fetch(url, options);
                        if (!response.ok) {
                            // For server errors, we don't retry, we fail fast.
                            if (response.status >= 500 && response.status < 600) {
                                throw new Error(`Server error: ${response.status}`);
                            }
                            // For other client-side errors, we also fail. Network errors will be caught by the catch block.
                             throw new Error(`HTTP error: ${response.status}`);
                        }
                        if (loadingOverlay.style.display === 'flex') loadingOverlay.style.display = 'none';
                        return await response.json();
                    } catch (error) {
                        // Only retry on network errors (TypeError: Failed to fetch)
                        if (error instanceof TypeError && error.message === "Failed to fetch") {
                            attempt++;
                            console.warn(`Attempt ${attempt} to fetch ${url} failed. Retrying...`);
                            if (attempt >= maxRetries) {
                                if (isInitialLoad) {
                                    loadingMessage.textContent = `Server did not respond. Please try restarting the app.`;
                                }
                                throw new Error("Server is not responding.");
                            }
                            if (loadingOverlay.style.display !== 'flex') {
                                loadingOverlay.style.display = 'flex';
                                loadingMessage.textContent = `Reconnecting to server...`;
                            } else if (isInitialLoad) {
                                loadingMessage.textContent = `Waking up server... (Attempt ${attempt}/${maxRetries})`;
                            }
                            await new Promise(resolve => setTimeout(resolve, 5000));
                        } else {
                            // For non-network errors, fail immediately
                            if (loadingOverlay.style.display === 'flex') loadingOverlay.style.display = 'none';
                            throw error;
                        }
                    }
                }
            }

            async function initializeApp() {
                try {
                    const roleData = await fetchWithRetry(`${API_BASE_URL}/role_data`, {}, true);
                    
                    favorites = await window.electronAPI.getFavorites();
                    const ddragonResponse = await fetch('https://ddragon.leagueoflegends.com/cdn/14.13.1/data/en_US/champion.json');
                    const champData = await ddragonResponse.json();
                    
                    allChampions = Object.values(champData.data);
                    allChampions.push({id: 'Ambessa', name: 'Ambessa', image: {full: 'Ambessa.png'}, key: '799'}, {id: 'Aurora', name: 'Aurora', image: {full: 'Aurora.png'}, key: '893'}, {id: 'Mel', name: 'Mel', image: {full: 'Mel.png'}, key: '800'});
                    allChampions.forEach(champ => { champIdToName[champ.key] = champ.id; });
                    
                    roleData.forEach(item => {
                        if (!roleProbabilities[item.champion]) roleProbabilities[item.champion] = {};
                        roleProbabilities[item.champion][item.role] = item.pick_rate;
                        validRolesSet.add(`${item.champion}-${item.role}`);
                    });

                    banRecRoleSelect.innerHTML = roles.map(r => `<option value="${r}">${r}</option>`).join('');
                    createRoleSlots();
                    populateChampionGrid();
                    updateTeamSideLabels();
                    updateAllGridFavoriteStars();
                } catch (e) {
                    loadingMessage.textContent = `Error: ${e.message}`;
                    alert(`Failed to initialize app: ${e.message}`);
                }
            }

            function updateTeamSideLabels() {
                const leftHeader = document.getElementById('left-team-header');
                const rightHeader = document.getElementById('right-team-header');
                if (leftPanelIsBlue) {
                    leftHeader.textContent = 'Blue Side';
                    leftHeader.className = 'blue-side';
                    rightHeader.textContent = 'Red Side';
                    rightHeader.className = 'red-side';
                } else {
                    leftHeader.textContent = 'Red Side';
                    leftHeader.className = 'red-side';
                    rightHeader.textContent = 'Blue Side';
                    rightHeader.className = 'blue-side';
                }
            }

            function createRoleSlots() {
                leftTeamPanel.innerHTML = '<h2 id="left-team-header"></h2>';
                rightTeamPanel.innerHTML = '<h2 id="right-team-header"></h2>';
                roles.forEach(role => {
                    const iconSrc = `https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-clash/global/default/assets/images/position-selector/positions/icon-position-${role.toLowerCase()}.png`;
                    leftTeamPanel.innerHTML += `<div class="role-slot" data-side="left" data-role="${role}"><img class="role-icon" src="${iconSrc}"><div class="lock-icon">🔓</div></div>`;
                    rightTeamPanel.innerHTML += `<div class="role-slot" data-side="right" data-role="${role}"><img class="role-icon" src="${iconSrc}"><div class="lock-icon">🔓</div></div>`;
                });
            }

            function populateChampionGrid() {
                const query = searchInput.value.toLowerCase();
                const filteredChamps = allChampions.filter(c => c.name.toLowerCase().includes(query));
                championGrid.innerHTML = filteredChamps.sort((a,b) => a.name.localeCompare(b.name)).map(champ => `
                    <div class="champion-tile" data-champion-name="${champ.id}">
                        <img src="./assets/champions/${champ.image.full}" title="${champ.name}">
                        <div class="grid-favorite-star">★</div>
                    </div>
                `).join('');
                updateAllGridFavoriteStars();
                updateAvailabilityUI();
                updateBanSelectionUI();
            }

            function setChampionForSlot(side, role, championName) {
                const slot = document.querySelector(`[data-side='${side}'][data-role='${role}']`);
                if (!slot) return;
                slot.querySelector('.role-icon').style.display = 'block';
                const existingPortrait = slot.querySelector('.champion-portrait');
                if (existingPortrait) existingPortrait.remove();
                const existingWarning = slot.querySelector('.warning-icon');
                if (existingWarning) existingWarning.remove();
                if (championName) {
                    slot.querySelector('.role-icon').style.display = 'none';
                    const champData = allChampions.find(c => c.id === championName);
                    if (champData) {
                        const portrait = document.createElement('img');
                        portrait.className = 'champion-portrait';
                        portrait.src = `./assets/champions/${champData.image.full}`;
                        slot.appendChild(portrait);
                        slot.dataset.champion = championName;
                    }
                    if (!validRolesSet.has(`${championName}-${role}`)) {
                        const warningIcon = document.createElement('span');
                        warningIcon.className = `warning-icon ${side === 'left' ? 'left' : 'right'}`;
                        warningIcon.textContent = '⚠️';
                        slot.appendChild(warningIcon);
                    }
                } else {
                    delete slot.dataset.champion;
                    const lockId = `${side}-${role}`;
                    if (lockedSlots.has(lockId)) {
                        toggleLock(slot);
                    }
                }
            }

            function resetDraft() {
                document.querySelectorAll('.role-slot').forEach(slot => {
                    slot.querySelector('.role-icon').style.display = 'block';
                    const portrait = slot.querySelector('.champion-portrait');
                    if (portrait) portrait.remove();
                    const warning = slot.querySelector('.warning-icon');
                    if(warning) warning.remove();
                    delete slot.dataset.champion;
                    slot.classList.remove('selected', 'swap-source');
                });
                recommendationList.innerHTML = '';
                analysisView.innerHTML = '';
                banRecommendationList.innerHTML = '';
                getRecsBtn.disabled = true;
                getRecsBtn.textContent = "Get Recommendations";
                recsHeader.textContent = "Recommendations:";
                swapSourceSlot = null;
                recommendationTarget = null;
                roleRateFilter.value = '';
                recommendationSearch.value = '';
                favoritesOnlyToggle.checked = false;
                leftPanelIsBlue = true;
                updateTeamSideLabels();
                unavailableChampions.clear();
                lockedSlots.clear();
                banConsiderationSet.clear();
                document.querySelectorAll('.lock-icon').forEach(icon => {
                    icon.classList.remove('locked');
                    icon.textContent = '🔓';
                });
                updateAvailabilityUI();
                updateBanSelectionUI();
            }

            async function updateRecommendations() {
                if (!recommendationTarget) return;
                const targetIsBlue = (recommendationTarget.side === 'left' && leftPanelIsBlue) || (recommendationTarget.side === 'right' && !leftPanelIsBlue);
                const recSideName = targetIsBlue ? "BLUE" : "RED";
                recsHeader.textContent = `Recommendations for ${recSideName} ${recommendationTarget.role}:`;

                recommendationList.innerHTML = '<li>Calculating...</li>';
                const myTeamPanelSide = recommendationTarget.side;
                const enemyTeamPanelSide = myTeamPanelSide === 'left' ? 'right' : 'left';
                const myTeam = {}; const enemyTeam = {};
                roles.forEach(role => {
                    myTeam[role] = document.querySelector(`[data-side='${myTeamPanelSide}'][data-role='${role}']`).dataset.champion || null;

            async function updateFromLiveGame() {
                const session = await window.electronAPI.getChampSelect();
                if (!session) return;
                
                unavailableChampions.clear();
                const bans = session.actions.flat().filter(a => a.type === 'ban' && a.completed);
                for (const ban of bans) {
                    if (ban.championId !== 0 && champIdToName[ban.championId]) {
                        unavailableChampions.add(champIdToName[ban.championId]);
                    }
                }
                for (const team of [session.myTeam, session.theirTeam]) {
                    for (const player of team) {
                        if (player.championId !== 0 && champIdToName[player.championId]) {
                            unavailableChampions.add(champIdToName[player.championId]);
                        }
                    }
                }

                const myPicks = session.myTeam.map(p => champIdToName[p.championId]).filter(Boolean);
                const theirPicks = session.theirTeam.map(p => champIdToName[p.championId]).filter(Boolean);

                const myLockedSlots = new Map();
                const theirLockedSlots = new Map();
                lockedSlots.forEach(lockId => {
                    const [side, role] = lockId.split('-');
                    const slot = document.querySelector(`[data-side='${side}'][data-role='${role}']`);
                    if (slot && slot.dataset.champion) {
                        if (side === 'left') myLockedSlots.set(role, slot.dataset.champion);
                        else if (side === 'right') theirLockedSlots.set(role, slot.dataset.champion);
                    }
                });

                const myAssignments = inferRoles(myPicks, myLockedSlots);
                const theirAssignments = inferRoles(theirPicks, theirLockedSlots);

                let currentDraftState = '';
                roles.forEach(role => { currentDraftState += (myAssignments[role] || '') + (theirAssignments[role] || ''); });

                if (currentDraftState !== lastKnownDraftState) {
                    lastKnownDraftState = currentDraftState;
                    roles.forEach(role => {
                        setChampionForSlot('left', role, myAssignments[role]);
                        setChampionForSlot('right', role, theirAssignments[role]);
                    });
                    if (recommendationTarget) {
                        updateRecommendations();
                    }
                    updateAnalysisView();
                }
                updateAvailabilityUI();
            }
            
            function inferRoles(picks, lockedChamps) {
                let finalAssignments = {};
                let availableRoles = [...roles];
                let availableChamps = [...picks];

                for (const [role, champ] of lockedChamps.entries()) {
                    finalAssignments[role] = champ;
                    availableRoles = availableRoles.filter(r => r !== role);
                    availableChamps = availableChamps.filter(c => c !== champ);
                }

                if (availableChamps.length === 0) return finalAssignments;

                let bestOverallAssignment = {};
                let maxOverallProb = -1;

                function getPermutations(arr) {
                    if (arr.length === 0) return [[]];
                    const result = [];
                    for (let i = 0; i < arr.length; i++) {
                        const rest = arr.slice(0, i).concat(arr.slice(i + 1));
                        const perms = getPermutations(rest);
                        for (const p of perms) { result.push([arr[i]].concat(p)); }
                    }
                    return result;
                }
                
                function getCombinations(arr, k) {
                    const result = [];
                    function backtrack(combination, start) {
                        if (combination.length === k) { result.push([...combination]); return; }
                        for (let i = start; i < arr.length; i++) {
                            combination.push(arr[i]);
                            backtrack(combination, i + 1);
                            combination.pop();
                        }
                    }
                    backtrack([], 0);
                    return result;
                }

                const roleCombinations = getCombinations(availableRoles, availableChamps.length);
                const champPermutations = getPermutations(availableChamps);

                for (const roleCombo of roleCombinations) {
                    for (const champPerm of champPermutations) {
                        let currentAssignment = {};
                        let currentProb = 1.0;
                        for (let i = 0; i < champPerm.length; i++) {
                            const champ = champPerm[i];
                            const role = roleCombo[i];
                            currentAssignment[role] = champ;
                            const prob = (roleProbabilities[champ] && roleProbabilities[champ][role]) || 0.00001;
                            currentProb *= prob;
                        }

                        if (currentProb > maxOverallProb) {
                            maxOverallProb = currentProb;
                            bestOverallAssignment = currentAssignment;
                        }
                    }
                }
                
                Object.assign(finalAssignments, bestOverallAssignment);
                return finalAssignments;
            }

                    }
                });
                element.addEventListener('mouseout', () => {
                    lastHoveredRec = null;
                    deltaTooltip.style.opacity = '0';
                });
            });
            
            function updateTooltipContent(target, shiftPressed) {
                if (!target || !target.dataset.breakdown) return;
                const breakdown = JSON.parse(target.dataset.breakdown);
                const breakdownMap = Object.fromEntries(breakdown.map(item => [item.source, {delta: item.delta, games: item.games}]));
                
                const leftHeader = leftPanelIsBlue ? 'Blue Side' : 'Red Side';
                const rightHeader = leftPanelIsBlue ? 'Red Side' : 'Blue Side';
                
                let leftHTML = `<h5>${leftHeader}</h5>`;
                let rightHTML = `<h5>${rightHeader}</h5>`;

                roles.forEach(role => {
                    const leftChamp = document.querySelector(`[data-side="left"][data-role="${role}"]`).dataset.champion;
                    const rightChamp = document.querySelector(`[data-side="right"][data-role="${role}"]`).dataset.champion;
                    
                    const leftSideColor = leftPanelIsBlue ? 'blue' : 'red';
                    const rightSideColor = leftPanelIsBlue ? 'red' : 'blue';

                    leftHTML += buildTooltipRow(leftChamp, leftSideColor, role, breakdownMap, shiftPressed);
                    rightHTML += buildTooltipRow(rightChamp, rightSideColor, role, breakdownMap, shiftPressed);
                });
                deltaTooltip.innerHTML = `<h4>${target.dataset.championName} Breakdown</h4><div class="tooltip-columns"><div class="tooltip-col">${leftHTML}</div><div class="tooltip-col">${rightHTML}</div></div>`;
            }

            function formatGames(num) {
                if (num < 1000) return num.toString();
                return `${(num / 1000).toFixed(1)}k`;
            }

            function buildTooltipRow(champ, side, role, breakdownMap, showGames) {
                let recColor = null;
                if (recommendationTarget) {
                    const targetIsBlue = (recommendationTarget.side === 'left' && leftPanelIsBlue) || (recommendationTarget.side === 'right' && !leftPanelIsBlue);
                    recColor = targetIsBlue ? 'blue' : 'red';
                }

                if (recommendationTarget && recColor === side && recommendationTarget.role === role) {
                    return `<div><span class="delta-neutral">RECOMMENDING</span></div>`;
                } else if (champ) {
                    const stats = breakdownMap[champ] || {delta: 0, games: 0};
                    const delta = stats.delta * 100;
                    const deltaClass = delta >= 0 ? 'delta-pos' : 'delta-neg';
                    const gamesHTML = showGames ? `<span class="games-count">(${formatGames(stats.games)})</span>` : '';
                    return `<div><span class="champ-name" title="${champ}">${champ}</span> ${gamesHTML}<span class="${deltaClass}">${delta.toFixed(2)}%</span></div>`;
                } else {
                    return `<div><span class="delta-neutral">${role} MISSING</span></div>`;
                }
            }
            
            draftArea.addEventListener('mouseover', e => {
                const warningIcon = e.target.closest('.warning-icon');
                if (warningIcon) {
                    warningTooltip.style.left = `${e.clientX + 15}px`;
                    warningTooltip.style.top = `${e.clientY + 15}px`;
                    warningTooltip.style.opacity = '1';
                }
            });
            draftArea.addEventListener('mouseout', e => {
                if (e.target.closest('.warning-icon')) {
                    warningTooltip.style.opacity = '0';
                }
            });
            
            initializeApp();

            // --- NEW: Keep-alive ping ---
            setInterval(() => {
                console.log("Pinging server to keep it awake...");
                fetch(`${API_BASE_URL}/ping`)
                    .then(res => {
                        if (res.ok) console.log("Ping successful.");
                        else console.warn("Ping failed, server might be restarting.");
                    })
                    .catch(err => console.error("Ping failed:", err));
            }, 10 * 60 * 1000); // 10 minutes
        });
    </script>
</body>
</html>
