<!-- desktop-app/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delta Draft Recommender</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #eaeaea; display: flex; justify-content: center; }
        .container { display: flex; gap: 50px; }
        .team { padding: 20px; background-color: #2a2a2a; border-radius: 8px; }
        .team h2 { color: #5090d0; }
        .enemy-team h2 { color: #d05050; }
        .role-picker { margin-bottom: 10px; }
        .role-picker label { display: inline-block; width: 80px; }
        select, button { padding: 8px; border-radius: 4px; border: 1px solid #555; background-color: #333; color: #fff; }
        #results { margin-top: 20px; }
        li { background-color: #333; margin: 5px 0; padding: 10px; border-radius: 4px; }
        .live-indicator { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background-color: #555; margin-right: 8px; }
        .live-indicator.active { background-color: #e60000; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(230, 0, 0, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(230, 0, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(230, 0, 0, 0); } }
    </style>
</head>
<body>
    <div>
        <h1>Draft Recommender</h1>
        <div style="margin-bottom: 20px;">
             <button id="live-tracking-btn"><span id="live-indicator" class="live-indicator"></span>Start Live Tracking</button>
        </div>
        <div class="container">
            <div class="team my-team"><h2>My Team</h2></div>
            <div class="team enemy-team"><h2>Enemy Team</h2></div>
        </div>
        <div style="margin-top: 20px;">
            <label for="target-role">Get Recommendations for:</label>
            <select id="target-role"></select>
            <button id="get-recs-btn">Get Recommendations</button>
        </div>
        <div id="results"><h3>Recommendations:</h3><ol id="recommendation-list"></ol></div>
    </div>

    <script>
        const allChampions = ["Aatrox", "Ahri", "Akali", "Alistar", "Amumu", "Anivia", "Annie", "Aphelios", "Ashe", "Azir", "Bard", "Blitzcrank", "Brand", "Braum", "Caitlyn", "Camille", "Cassiopeia", "Chogath", "Corki", "Darius", "Diana", "Draven", "DrMundo", "Ekko", "Elise", "Evelynn", "Ezreal", "Fiddlesticks", "Fiora", "Fizz", "Galio", "Gangplank", "Garen", "Gnar", "Gragas", "Graves", "Gwen", "Hecarim", "Heimerdinger", "Illaoi", "Irelia", "Ivern", "Janna", "JarvanIV", "Jax", "Jayce", "Jhin", "Jinx", "Kaisa", "Kalista", "Karma", "Karthus", "Kassadin", "Katarina", "Kayle", "Kayn", "Kennen", "Khazix", "Kindred", "Kled", "KogMaw", "Leblanc", "LeeSin", "Leona", "Lillia", "Lissandra", "Lucian", "Lulu", "Lux", "Malphite", "Malzahar", "Maokai", "MasterYi", "MissFortune", "MonkeyKing", "Mordekaiser", "Morgana", "Nami", "Nasus", "Nautilus", "Neeko", "Nidalee", "Nocturne", "Nunu", "Olaf", "Orianna", "Ornn", "Pantheon", "Poppy", "Pyke", "Qiyana", "Quinn", "Rakan", "Rammus", "RekSai", "Rell", "Renata", "Renekton", "Rengar", "Riven", "Rumble", "Ryze", "Samira", "Sejuani", "Senna", "Seraphine", "Sett", "Shaco", "Shen", "Shyvana", "Singed", "Sion", "Sivir", "Skarner", "Sona", "Soraka", "Swain", "Sylas", "Syndra", "TahmKench", "Taliyah", "Talon", "Taric", "Teemo", "Thresh", "Tristana", "Trundle", "Tryndamere", "TwistedFate", "Twitch", "Udyr", "Urgot", "Varus", "Vayne", "Veigar", "Velkoz", "Vex", "Vi", "Viego", "Viktor", "Vladimir", "Volibear", "Warwick", "Xayah", "Xerath", "XinZhao", "Yasuo", "Yone", "Yorick", "Yuumi", "Zac", "Zed", "Zeri", "Ziggs", "Zilean", "Zoe", "Zyra", "Ambessa", "Mel", "Aurora"];
        const roles = ['TOP', 'JUNGLE', 'MIDDLE', 'BOTTOM', 'UTILITY'];
        let champIdToName = {}; // Will be populated later if needed

        function createRolePicker(role, teamClass) { /* ... same as before ... */ }
        roles.forEach(role => { /* ... same as before ... */ });

        // --- LCU TRACKING LOGIC ---
        let lcuIntervalId = null;
        const liveTrackingBtn = document.getElementById('live-tracking-btn');
        const liveIndicator = document.getElementById('live-indicator');

        liveTrackingBtn.addEventListener('click', () => {
            if (lcuIntervalId) { // If it's running, stop it
                clearInterval(lcuIntervalId);
                lcuIntervalId = null;
                liveIndicator.classList.remove('active');
                liveTrackingBtn.innerHTML = '<span id="live-indicator" class="live-indicator"></span>Start Live Tracking';
            } else { // If it's not running, start it
                updateFromLiveGame(); // Run once immediately
                lcuIntervalId = setInterval(updateFromLiveGame, 1000); // Poll every second
                liveIndicator.classList.add('active');
                liveTrackingBtn.innerHTML = '<span id="live-indicator" class="live-indicator active"></span>Stop Live Tracking';
            }
        });

        async function updateFromLiveGame() {
            const session = await window.electronAPI.getChampSelect();
            if (!session) {
                // Not in champ select, do nothing.
                return;
            }

            // A very simplified update logic
            const allPicks = session.myTeam.concat(session.theirTeam);
            
            // We need a mapping from Champion ID to Name to update the UI
            // This is a simplified version. A real app might load this from a file.
            if (Object.keys(champIdToName).length === 0) {
                 const response = await fetch('https://ddragon.leagueoflegends.com/cdn/14.13.1/data/en_US/champion.json');
                 const champData = await response.json();
                 for (const champ in champData.data) {
                     champIdToName[champData.data[champ].key] = champData.data[champ].id;
                 }
            }
            
            for (const player of allPicks) {
                const teamClass = session.myTeam.includes(player) ? 'my-team' : 'enemy-team';
                // Note: The LCU API does not explicitly provide the role (TOP, JNG, etc.)
                // The original repo uses complex logic to infer it. We will use the assignedPosition for now.
                const role = player.assignedPosition.toUpperCase() || 'UTILITY'; // Default to something
                
                if (roles.includes(role)) {
                    const selectElement = document.getElementById(`${teamClass}-${role}`);
                    if (selectElement) {
                        const champName = champIdToName[player.championId];
                        if (champName) {
                            selectElement.value = champName;
                        }
                    }
                }
            }
        }
        // --- END OF LCU LOGIC ---
        
        // --- RECOMMENDATION LOGIC (no changes) ---
        document.getElementById('get-recs-btn').addEventListener('click', async () => { /* ... same as before ... */ });
        
        // Helper to create the UI elements (no changes)
        function createRolePicker(role, teamClass) {
            const container = document.querySelector(`.${teamClass}`);
            const pickerDiv = document.createElement('div');
            pickerDiv.className = 'role-picker';
            const label = document.createElement('label');
            label.textContent = role;
            const select = document.createElement('select');
            select.id = `${teamClass}-${role}`;
            const emptyOption = document.createElement('option');
            emptyOption.value = "";
            emptyOption.textContent = "---";
            select.appendChild(emptyOption);
            allChampions.sort().forEach(champ => {
                const option = document.createElement('option');
                option.value = champ;
                option.textContent = champ;
                select.appendChild(option);
            });
            pickerDiv.appendChild(label);
            pickerDiv.appendChild(select);
            container.appendChild(pickerDiv);
        }
        roles.forEach(role => {
            createRolePicker(role, 'my-team');
            createRolePicker(role, 'enemy-team');
            const targetRoleSelect = document.getElementById('target-role');
            const option = document.createElement('option');
            option.value = role;
            option.textContent = role;
            targetRoleSelect.appendChild(option);
        });
        document.getElementById('get-recs-btn').addEventListener('click', async () => {
            const myTeam = {};
            const enemyTeam = {};
            roles.forEach(role => {
                myTeam[role] = document.getElementById(`my-team-${role}`).value || null;
                enemyTeam[role] = document.getElementById(`enemy-team-${role}`).value || null;
            });
            
            const targetRole = document.getElementById('target-role').value;

            const response = await fetch('http://127.0.0.1:5000/recommend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ my_team: myTeam, enemy_team: enemyTeam, target_role: targetRole })
            });
            
            const recommendations = await response.json();
            
            const listElement = document.getElementById('recommendation-list');
            listElement.innerHTML = ''; // Clear previous results
            
            recommendations.forEach(pick => {
                const listItem = document.createElement('li');
                const deltaStr = (pick.total_delta >= 0 ? '+' : '') + (pick.total_delta * 100).toFixed(2) + '%';
                const baseWrStr = (pick.base_win_rate * 100).toFixed(2) + '%';
                listItem.textContent = `${pick.champion} | Delta: ${deltaStr} | Base WR: ${baseWrStr}`;
                listElement.appendChild(listItem);
            });
        });
    </script>
</body>
</html>
