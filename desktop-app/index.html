<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delta Draft</title>
    <style>
        :root { --bg-primary: #0f172a; --bg-secondary: #1e293b; --border-color: #334155; --text-primary: #e2e8f0; --text-secondary: #94a3b8; --accent-color: #60a5fa; --green-pos: #22c55e; --red-neg: #ef4444; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg-primary); color: var(--text-primary); display: flex; justify-content: center; margin: 0; padding: 20px; }
        * { box-sizing: border-box; }
        .app-container { width: 100%; max-width: 1200px; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 20px; }
        button { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color); background-color: var(--bg-secondary); color: var(--text-primary); font-size: 1rem; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: var(--border-color); }
        button:disabled { background-color: #1e293b; color: #475569; cursor: not-allowed; }
        .live-indicator { width: 10px; height: 10px; border-radius: 50%; background-color: #64748b; margin-right: 8px; display: inline-block; transition: background-color 0.3s; }
        .live-indicator.active { background-color: var(--red-neg); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } }
        .draft-area { display: flex; justify-content: space-between; gap: 20px; }
        .team-panel { width: 150px; display: flex; flex-direction: column; gap: 10px; }
        .role-slot { width: 100%; height: 100px; background-color: var(--bg-secondary); border: 2px dashed var(--border-color); border-radius: 8px; position: relative; cursor: pointer; transition: border-color 0.2s; overflow: hidden; }
        .role-slot.selected { border-color: var(--accent-color); border-style: solid; }
        .role-icon { width: 50%; height: 50%; opacity: 0.2; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .champion-portrait { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; pointer-events: none; }
        .center-column { flex-grow: 1; display: flex; flex-direction: column; }
        #search-champion { width: 100%; padding: 10px; margin-bottom: 10px; background-color: var(--bg-secondary); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 6px; font-size: 1rem; }
        #champion-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; height: 350px; overflow-y: auto; padding-right: 10px; margin-bottom: 20px;}
        .champion-tile { cursor: pointer; position: relative; }
        .champion-tile img { width: 100%; display: block; border-radius: 4px; border: 2px solid transparent; transition: border-color 0.2s; }
        .champion-tile:hover img { border-color: var(--accent-color); }
        #results { background-color: var(--bg-secondary); padding: 15px; border-radius: 8px; flex-grow: 1; display: flex; flex-direction: column; }
        #recommendation-list { list-style: none; padding: 0; flex-grow: 1; overflow-y: auto; }
        #recommendation-list li { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid var(--border-color); position: relative; }
        .rec-img { width: 40px; height: 40px; border-radius: 4px; }
        .rec-info { flex-grow: 1; }
        .rec-name { font-weight: bold; }
        .rec-stats { font-size: 0.8rem; color: var(--text-secondary); }
        .delta-pos { color: var(--green-pos); } .delta-neg { color: var(--red-neg); }
        
        /* --- Tooltip Styles --- */
        #delta-tooltip { position: fixed; background-color: #020617; border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; z-index: 100; width: 320px; pointer-events: none; opacity: 0; transition: opacity 0.1s; }
        #delta-tooltip h4 { margin: 0 0 10px 0; color: var(--accent-color); font-size: 1rem; text-align: center; }
        .tooltip-columns { display: flex; justify-content: space-between; gap: 15px; }
        .tooltip-col { flex: 1; }
        .tooltip-col h5 { margin: 0 0 5px 0; font-size: 0.9rem; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); padding-bottom: 3px; }
        .tooltip-col div { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 2px; height: 20px; align-items: center;}
        .delta-neutral { color: var(--text-secondary); font-style: italic; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header"><h1>Delta Draft</h1></div>
        <div class="controls">
            <button id="reset-btn">Reset Draft</button>
            <button id="live-tracking-btn"><span id="live-indicator" class="live-indicator"></span>Start Live Tracking</button>
            <button id="get-recs-btn" disabled>Get Recommendations</button>
        </div>
        <div class="draft-area">
            <div class="team-panel" id="blue-team"></div>
            <div class="center-column">
                <input type="text" id="search-champion" placeholder="Search for a champion...">
                <div id="champion-grid"></div>
                <div id="results"><h3>Recommendations:</h3><ol id="recommendation-list"></ol></div>
            </div>
            <div class="team-panel" id="red-team"></div>
        </div>
        <div id="delta-tooltip"></div>
    </div>

    <script>
        const roles = ['TOP', 'JUNGLE', 'MIDDLE', 'BOTTOM', 'UTILITY'];
        let allChampions = [];
        let champIdToName = {};
        let roleProbabilities = {};
        let selectedRoleSlot = null;
        let lcuIntervalId = null;

        const championGrid = document.getElementById('champion-grid');
        const searchInput = document.getElementById('search-champion');
        const recommendationList = document.getElementById('recommendation-list');
        const liveTrackingBtn = document.getElementById('live-tracking-btn');
        const resetBtn = document.getElementById('reset-btn');
        const getRecsBtn = document.getElementById('get-recs-btn');
        const tooltip = document.getElementById('delta-tooltip');

        async function initializeApp() {
            try {
                const response = await fetch('https://ddragon.leagueoflegends.com/cdn/14.13.1/data/en_US/champion.json');
                const champData = await response.json();
                allChampions = Object.values(champData.data);
                allChampions.push({id: 'Ambessa', name: 'Ambessa', image: {full: 'Ambessa.png'}});
                allChampions.push({id: 'Aurora', name: 'Aurora', image: {full: 'Aurora.png'}});
                allChampions.push({id: 'Mel', name: 'Mel', image: {full: 'Mel.png'}});
                
                allChampions.forEach(champ => { champIdToName[champ.key] = champ.id; });
                champIdToName[799] = 'Ambessa'; champIdToName[800] = 'Mel'; champIdToName[893] = 'Aurora';

            } catch (e) { console.error("Could not fetch champion list from Data Dragon", e); }
            
            createRoleSlots();
            populateChampionGrid();
        }

        function createRoleSlots() {
            const blueTeamPanel = document.getElementById('blue-team');
            const redTeamPanel = document.getElementById('red-team');
            blueTeamPanel.innerHTML = '<h2>Blue Side</h2>';
            redTeamPanel.innerHTML = '<h2>Red Side</h2>';
            roles.forEach(role => {
                const iconSrc = `https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-clash/global/default/assets/images/position-selector/positions/icon-position-${role.toLowerCase()}.png`;
                blueTeamPanel.innerHTML += `<div class="role-slot" data-side="blue" data-role="${role}"><img class="role-icon" src="${iconSrc}"></div>`;
                redTeamPanel.innerHTML += `<div class="role-slot" data-side="red" data-role="${role}"><img class="role-icon" src="${iconSrc}"></div>`;
            });
        }

        function populateChampionGrid() {
            const query = searchInput.value.toLowerCase();
            const filteredChamps = allChampions.filter(c => c.name.toLowerCase().includes(query));
            championGrid.innerHTML = filteredChamps.sort((a,b) => a.name.localeCompare(b.name)).map(champ => `
                <div class="champion-tile" data-champion-name="${champ.id}">
                    <img src="./assets/champions/${champ.image.full}" title="${champ.name}">
                </div>
            `).join('');
        }

        function setChampionForSlot(side, role, championName) {
            const slot = document.querySelector(`[data-side='${side}'][data-role='${role}']`);
            if (!slot) return;
            const existingPortrait = slot.querySelector('.champion-portrait');
            if (existingPortrait) existingPortrait.remove();
            
            if (championName) {
                const champData = allChampions.find(c => c.id === championName);
                if (champData) {
                    const portrait = document.createElement('img');
                    portrait.className = 'champion-portrait';
                    portrait.src = `./assets/champions/${champData.image.full}`;
                    slot.appendChild(portrait);
                    slot.dataset.champion = championName;
                }
            } else { delete slot.dataset.champion; }
        }

        function resetDraft() {
            document.querySelectorAll('.role-slot').forEach(slot => {
                const portrait = slot.querySelector('.champion-portrait');
                if (portrait) portrait.remove();
                delete slot.dataset.champion;
                slot.classList.remove('selected');
            });
            recommendationList.innerHTML = '';
            getRecsBtn.disabled = true;
            getRecsBtn.textContent = "Get Recommendations";
            selectedRoleSlot = null;
        }

        async function getRecommendations() {
            if (!selectedRoleSlot) return;
            getRecsBtn.disabled = true;
            getRecsBtn.textContent = "Calculating...";

            const myTeamIsBlue = selectedRoleSlot.side === 'blue';
            const myTeam = {}; const enemyTeam = {};
            roles.forEach(role => {
                const blueChamp = document.querySelector(`[data-side='blue'][data-role='${role}']`).dataset.champion;
                const redChamp = document.querySelector(`[data-side='red'][data-role='${role}']`).dataset.champion;
                myTeam[role] = (myTeamIsBlue ? blueChamp : redChamp) || null;
                enemyTeam[role] = (myTeamIsBlue ? redChamp : blueChamp) || null;
            });

            try {
                const response = await fetch('http://127.0.0.1:5000/recommend', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ my_team: myTeam, enemy_team: enemyTeam, target_role: selectedRoleSlot.role })
                });
                if (!response.ok) throw new Error("Backend server error");
                const recommendations = await response.json();
                recommendationList.innerHTML = '';
                recommendations.forEach(pick => {
                    const champData = allChampions.find(c => c.id === pick.champion);
                    if (!champData) return;
                    const li = document.createElement('li');
                    li.dataset.breakdown = JSON.stringify(pick.breakdown);
                    const deltaStr = (pick.total_delta >= 0 ? '+' : '') + (pick.total_delta * 100).toFixed(2) + '%';
                    const baseWrStr = (pick.base_win_rate * 100).toFixed(2) + '%';
                    const pickRateStr = (pick.pick_rate * 100).toFixed(2) + '%';
                    li.innerHTML = `<img class="rec-img" src="./assets/champions/${champData.image.full}"><div class="rec-info"><div class="rec-name">${pick.champion}</div><div class="rec-stats"><span>Delta: <b class="${pick.total_delta >= 0 ? 'delta-pos' : 'delta-neg'}">${deltaStr}</b></span> | <span>Base WR: ${baseWrStr}</span> | <span>Role Rate: ${pickRateStr}</span></div></div>`;
                    recommendationList.appendChild(li);
                });
            } catch (error) { console.error("Failed to get recommendations:", error); alert("Could not get recommendations. Is the Python backend server running?"); } 
            finally { getRecsBtn.disabled = false; getRecsBtn.textContent = `Get Recs for ${selectedRoleSlot.side.toUpperCase()} ${selectedRoleSlot.role}`; }
        }
        
        document.addEventListener('click', e => {
            const roleSlot = e.target.closest('.role-slot');
            const championTile = e.target.closest('.champion-tile');
            if (roleSlot) {
                document.querySelectorAll('.role-slot').forEach(s => s.classList.remove('selected'));
                if (!roleSlot.dataset.champion) {
                    roleSlot.classList.add('selected');
                    selectedRoleSlot = { side: roleSlot.dataset.side, role: roleSlot.dataset.role };
                    getRecsBtn.disabled = false;
                    getRecsBtn.textContent = `Get Recs for ${selectedRoleSlot.side.toUpperCase()} ${selectedRoleSlot.role}`;
                } else {
                    delete roleSlot.dataset.champion;
                    const portrait = roleSlot.querySelector('.champion-portrait');
                    if (portrait) portrait.remove();
                    selectedRoleSlot = null;
                    getRecsBtn.disabled = true;
                    getRecsBtn.textContent = "Get Recommendations";
                }
            } else if (championTile && selectedRoleSlot) {
                setChampionForSlot(selectedRoleSlot.side, selectedRoleSlot.role, championTile.dataset.championName);
                document.querySelector(`[data-side='${selectedRoleSlot.side}'][data-role='${selectedRoleSlot.role}']`).classList.remove('selected');
                selectedRoleSlot = null;
                getRecsBtn.disabled = true;
                getRecsBtn.textContent = "Get Recommendations";
            }
        });

        liveTrackingBtn.addEventListener('click', () => {
            const indicator = document.getElementById('live-indicator');
            if (lcuIntervalId) {
                clearInterval(lcuIntervalId); lcuIntervalId = null; indicator.classList.remove('active');
            } else {
                indicator.classList.add('active');
                initializeLCUData().then(() => {
                    updateFromLiveGame(); lcuIntervalId = setInterval(updateFromLiveGame, 1000);
                }).catch(() => indicator.classList.remove('active'));
            }
        });

        async function initializeLCUData() {
            if (Object.keys(roleProbabilities).length === 0) {
                 try {
                    const response = await fetch('http://127.0.0.1:5000/role_data');
                    const data = await response.json();
                    data.forEach(item => {
                        if (!roleProbabilities[item.champion]) roleProbabilities[item.champion] = {};
                        roleProbabilities[item.champion][item.role] = item.pick_rate;
                    });
                 } catch (e) { console.error("Failed to fetch role data:", e); alert("Could not load role probability data from backend."); throw e; }
            }
        }

        async function updateFromLiveGame() {
            const session = await window.electronAPI.getChampSelect();
            if (!session) return;
            const bluePicks = session.myTeam.map(p => champIdToName[p.championId]).filter(Boolean);
            const redPicks = session.theirTeam.map(p => champIdToName[p.championId]).filter(Boolean);
            const blueAssignments = inferRoles(bluePicks);
            const redAssignments = inferRoles(redPicks);
            roles.forEach(role => {
                setChampionForSlot('blue', role, blueAssignments[role]);
                setChampionForSlot('red', role, redAssignments[role]);
            });
        }

        function inferRoles(picks) {
            let assignments = {}; if (picks.length === 0) return assignments;
            let availableRoles = [...roles]; let availableChamps = [...picks]; let possibilities = [];
            availableChamps.forEach(champ => {
                availableRoles.forEach(role => {
                    const prob = (roleProbabilities[champ] && roleProbabilities[champ][role]) || 0.0001;
                    possibilities.push({ champ, role, prob });
                });
            });
            possibilities.sort((a, b) => b.prob - a.prob);
            while (availableChamps.length > 0 && availableRoles.length > 0) {
                let bestPickIndex = possibilities.findIndex(p => availableChamps.includes(p.champ) && availableRoles.includes(p.role));
                if (bestPickIndex === -1) break;
                const bestPick = possibilities[bestPickIndex];
                assignments[bestPick.role] = bestPick.champ;
                availableChamps = availableChamps.filter(c => c !== bestPick.champ);
                availableRoles = availableRoles.filter(r => r !== bestPick.role);
            }
            return assignments;
        }

        searchInput.addEventListener('input', populateChampionGrid);
        resetBtn.addEventListener('click', resetDraft);
        getRecsBtn.addEventListener('click', getRecommendations);
        
        // --- NEW TOOLTIP LOGIC ---
        recommendationList.addEventListener('mouseover', e => {
            const li = e.target.closest('li');
            if (!li || !li.dataset.breakdown) return;
            
            const breakdown = JSON.parse(li.dataset.breakdown);
            const breakdownMap = Object.fromEntries(breakdown.map(item => [item.source, item.delta]));
            
            let blueHTML = '<h5>Blue Side</h5>';
            let redHTML = '<h5>Red Side</h5>';
            
            roles.forEach(role => {
                const blueChamp = document.querySelector(`[data-side="blue"][data-role="${role}"]`).dataset.champion;
                const redChamp = document.querySelector(`[data-side="red"][data-role="${role}"]`).dataset.champion;

                // Build Blue Side Column
                if (selectedRoleSlot && selectedRoleSlot.side === 'blue' && selectedRoleSlot.role === role) {
                    blueHTML += `<div><span class="delta-neutral">RECOMMENDING</span></div>`;
                } else if (blueChamp) {
                    const delta = (breakdownMap[blueChamp] || 0) * 100;
                    const deltaClass = delta >= 0 ? 'delta-pos' : 'delta-neg';
                    blueHTML += `<div><span>${blueChamp}</span><span class="${deltaClass}">${delta.toFixed(2)}%</span></div>`;
                } else {
                    blueHTML += `<div><span class="delta-neutral">BLUE ${role} MISSING</span></div>`;
                }
                
                // Build Red Side Column
                if (selectedRoleSlot && selectedRoleSlot.side === 'red' && selectedRoleSlot.role === role) {
                    redHTML += `<div><span class="delta-neutral">RECOMMENDING</span></div>`;
                } else if (redChamp) {
                    const delta = (breakdownMap[redChamp] || 0) * 100;
                    const deltaClass = delta >= 0 ? 'delta-pos' : 'delta-neg';
                    redHTML += `<div><span>${redChamp}</span><span class="${deltaClass}">${delta.toFixed(2)}%</span></div>`;
                } else {
                    redHTML += `<div><span class="delta-neutral">RED ${role} MISSING</span></div>`;
                }
            });
            
            tooltip.innerHTML = `<h4>Delta Breakdown</h4><div class="tooltip-columns"><div class="tooltip-col">${blueHTML}</div><div class="tooltip-col">${redHTML}</div></div>`;
            tooltip.style.opacity = '1';
        });

        document.addEventListener('mousemove', e => {
            tooltip.style.left = `${e.pageX + 20}px`;
            tooltip.style.top = `${e.pageY + 20}px`;
        });
        
        recommendationList.addEventListener('mouseout', () => {
            tooltip.style.opacity = '0';
        });
        
        initializeApp();
    </script>
</body>
</html>
