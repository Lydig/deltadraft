name: Update LoLalytics Dataset

on:
  # This schedule runs the job at 06:00 and 18:00 UTC every day.
  schedule:
    - cron: '0 6,18 * * *'
  # This allows you to run the job manually from the GitHub Actions tab.
  workflow_dispatch:

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx tqdm boto3

      - name: Run Scraper Script
        # This command runs the script. The script will automatically read the
        # secrets because GitHub makes them available as environment variables.
        run: python scripts/scrape_lolalytics.py
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}